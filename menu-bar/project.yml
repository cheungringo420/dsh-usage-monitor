name: UsageWidget
options:
  bundleIdPrefix: io.github.cheungringo420
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CLANG_ENABLE_MODULES: YES
targets:
  UsageWidgetHost:
    type: application
    platform: macOS
    sources:
      - path: Host
        excludes: ["Info.plist"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cheungringo420.usagemonitor
        PRODUCT_NAME: UsageWidget
        INFOPLIST_FILE: Host/Info.plist
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: UsageWidgetExtension
        embed: true
  UsageWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes: ["Info.plist", "Widget.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cheungringo420.usagemonitor.widget
        PRODUCT_NAME: UsageWidgetExtension
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  UsageWidgetHost:
    build:
      targets:
        UsageWidgetHost: all
    run:
      config: Release
